name: DeepChess
options:
  bundleIdPrefix: com.amasaki
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 83VGKGSQUH
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"
targets:
  DeepChess:
    type: application
    platform: iOS
    sources:
      - path: DeepChess
    info:
      path: DeepChess/Info.plist
      properties:
        CFBundleDisplayName: 放課後チェス倶楽部
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIDeviceFamily:
          - 1
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserTrackingUsageDescription: Used to show relevant ads.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        GADApplicationIdentifier: ca-app-pub-9404799280370656~5663792779
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: GoogleMobileAds
