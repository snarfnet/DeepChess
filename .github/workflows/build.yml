name: Build and Upload to App Store

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode 26
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -n "$XCODE_APP" ]; then
          sudo xcode-select -s "/Applications/$XCODE_APP"
        else
          XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
          sudo xcode-select -s "/Applications/$XCODE_APP"
        fi
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 10 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        VERSION=$(grep 'MARKETING_VERSION:' project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
        echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUM\"/" project.yml

    - name: Generate Xcode project
      run: xcodegen generate

    - name: Patch Info.plist build number
      run: |
        sed -i "" "s|<string>\$(CURRENT_PROJECT_VERSION)</string>|<string>$BUILD_NUM</string>|" DeepChess/Info.plist
        sed -i "" "/<key>CFBundleVersion<\/key>/{n;s|<string>[^<]*</string>|<string>$BUILD_NUM</string>|;}" DeepChess/Info.plist
        grep -A1 CFBundleVersion DeepChess/Info.plist

    - name: Import Distribution Certificate
      env:
        CERT_BASE64: ${{ secrets.DIST_CERT_BASE64 }}
        CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        echo "$CERT_BASE64" | base64 -D > cert.p12
        security import cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        rm cert.p12

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8
        cp ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 /tmp/asc_key.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme DeepChess \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/DeepChess.xcarchive \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Export IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/DeepChess.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Capture Simulator Screenshots
      continue-on-error: true
      run: |
        set -e
        mkdir -p screenshots

        # Build for simulator: remove GoogleMobileAds dependency (code already guarded by #if)
        cp project.yml project_backup.yml
        sed -i '' '/^packages:/,/from:/d' project.yml
        sed -i '' '/- package: GoogleMobileAds/d' project.yml
        sed -i '' '/^[[:space:]]*dependencies:$/d' project.yml
        xcodegen generate

        xcodebuild build \
          -scheme DeepChess \
          -configuration Debug \
          -destination "platform=iOS Simulator,name=iPhone 16 Pro Max" \
          -derivedDataPath build/sim \
          CODE_SIGNING_ALLOWED=NO

        # Restore original project
        mv project_backup.yml project.yml
        xcodegen generate

        APP_PATH=$(find build/sim -name "DeepChess.app" -path "*/Debug-iphonesimulator/*" | head -1)
        echo "App: $APP_PATH"

        # 6.7-inch screenshots (iPhone 16 Pro Max)
        SIM67=$(xcrun simctl list devices available | grep "iPhone 16 Pro Max" | head -1 | sed 's/.*(\([A-F0-9-]*\)).*/\1/')
        if [ -z "$SIM67" ]; then
          SIM67=$(xcrun simctl create "Screenshot67" "iPhone 16 Pro Max")
        fi
        xcrun simctl boot "$SIM67" || true
        sleep 5
        xcrun simctl install "$SIM67" "$APP_PATH"

        # Launch with retry
        for attempt in 1 2 3; do
          xcrun simctl launch "$SIM67" com.amasaki.DeepChess && break
          echo "Launch attempt $attempt failed, waiting..."
          sleep 5
        done
        sleep 10
        xcrun simctl io "$SIM67" screenshot screenshots/ss_67_1.png
        xcrun simctl shutdown "$SIM67" || true

        # 6.5-inch: resize from 6.7" (1290x2796 -> 1242x2688)
        if [ -f screenshots/ss_67_1.png ]; then
          sips -z 2688 1242 screenshots/ss_67_1.png --out screenshots/ss_65_1.png
        fi

        ls -la screenshots/

    - name: Install PyJWT
      run: pip3 install --break-system-packages PyJWT requests

    - name: Submit for Review
      run: python3 scripts/submit.py ${{ env.BUILD_NUM }} ${{ env.APP_VERSION }}
